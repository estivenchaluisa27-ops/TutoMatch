<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Disponibilidad Horaria'">
<head>
<body>
    <th:block layout:fragment="content">
        <div class="row">
            <div class="col-12 mb-4">
                <h1 class="fw-bold">
                    <i class="bi bi-calendar-week me-2"></i>Disponibilidad Horaria
                </h1>
                <p class="text-muted">Define los bloques horarios en los que estar&aacute;s disponible para dar tutor&iacute;as.</p>
            </div>

            <div class="col-lg-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-plus-circle me-2"></i>Agregar Bloque
                    </div>
                    <div class="card-body">
                        <form th:action="@{/tutor/disponibilidad}" method="post">
                            <div class="mb-3">
                                <label for="diaSemana" class="form-label fw-semibold">D&iacute;a</label>
                                <select id="diaSemana" name="diaSemana" class="form-select" required>
                                    <option value="">Selecciona un d&iacute;a...</option>
                                    <option th:each="d, iter : ${dias}" th:value="${iter.index + 1}" th:text="${d}">Lunes</option>
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="horaInicio" class="form-label fw-semibold">Inicio</label>
                                    <input type="time" id="horaInicio" name="horaInicio" class="form-control" required step="1800">
                                </div>
                                <div class="col-6">
                                    <label for="horaFin" class="form-label fw-semibold">Fin</label>
                                    <input type="time" id="horaFin" name="horaFin" class="form-control" required step="1800">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-plus-circle me-1"></i>Agregar Bloque
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-list-check me-2"></i>Tus Bloques
                    </div>
                    <div class="card-body">
                        <div th:if="${#maps.isEmpty(bloquesPorDia)}" class="text-center text-muted py-4">
                            <i class="bi bi-calendar-plus fs-1 d-block mb-2"></i>
                            <p class="mb-0">No has agregado bloques horarios. Agrega tu primer bloque para empezar a recibir solicitudes.</p>
                        </div>

                        <div th:unless="${#maps.isEmpty(bloquesPorDia)}">
                            <div th:each="entry : ${bloquesPorDia}" class="mb-3">
                                <h6 class="fw-bold text-primary border-bottom pb-2" th:text="${dias[entry.key - 1]}">Lunes</h6>
                                <div th:each="bloque : ${entry.value}" class="d-flex justify-content-between align-items-center bg-light rounded p-2 mb-1">
                                        <span>
                                            <i class="bi bi-clock me-2 text-muted"></i>
                                            <span th:text="${bloque.horaInicio}">08:00</span>
                                            <span class="mx-1">&ndash;</span>
                                            <span th:text="${bloque.horaFin}">09:00</span>
                                            <span th:if="${bloque.estado.name() == 'RESERVADO'}" class="badge bg-warning text-dark ms-2">Reservado</span>
                                            <span th:if="${bloque.estado.name() == 'LIBRE'}" class="badge bg-success ms-2">Libre</span>
                                        </span>
                                        <form th:action="@{/tutor/disponibilidad/{id}/eliminar(id=${bloque.id})}" method="post" onsubmit="return confirm('Eliminar este bloque?')">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" th:disabled="${bloque.estado.name() == 'RESERVADO'}" aria-label="Eliminar bloque">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
