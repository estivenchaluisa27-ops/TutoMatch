<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Disponibilidad Horaria'">
<head>
<body>
    <th:block layout:fragment="content">
        <div class="sg-wrapper">
            <!-- Header -->
            <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
                <div>
                    <h1 class="fw-bold mb-1">
                        <i class="bi bi-calendar-week me-2"></i>Disponibilidad Semanal
                    </h1>
                    <p class="text-muted mb-0">Selecciona los bloques y las materias que impartir&aacute;s.</p>
                </div>
            </div>

            <!-- Week nav -->
            <div class="sg-nav">
                <a th:href="@{/tutor/disponibilidad/semanal(semana=${semanaAnterior})}" class="sg-nav-btn">
                    <i class="bi bi-chevron-left"></i> Semana anterior
                </a>
                <div class="sg-week-label">
                    <span th:text="${semanaRango}">07 \u2013 13 jul, 2026</span>
                    <small th:if="${esSemanaActual}">Semana actual</small>
                </div>
                <a th:href="@{/tutor/disponibilidad/semanal(semana=${semanaSiguiente})}" class="sg-nav-btn">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </a>
            </div>

            <!-- Actions -->
            <div class="sg-actions">
                <button class="sg-btn sg-btn-danger" id="btnLimpiar">
                    <i class="bi bi-trash3"></i> Limpiar Todo
                </button>
                <button class="sg-btn-icon-save" id="btnGuardar" disabled title="Guardar cambios">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                </button>
                <div id="sgToast" class="sg-toast" style="display:none"></div>
            </div>

            <!-- Grid -->
            <div class="sg-table-wrap">
                <table class="sg-table" id="sgTable">
                    <thead>
                        <tr>
                            <th class="sg-th-hour">Hora</th>
                            <th th:each="d : ${diasInfo}"
                                class="sg-th-day"
                                th:classappend="${d.esHoy} ? 'sg-th-today' : ''">
                                <span class="sg-day-name" th:text="${d.nombre}">Lun</span>
                                <span class="sg-day-date" th:text="${d.fecha}">07/07</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${horas}">
                            <td class="sg-td-hour" th:text="${h} + ':00'">07:00</td>
                            <td th:each="d : ${diasInfo}"
                                class="sg-cell"
                                th:data-dia="${d.diaSemana}"
                                th:data-hora="${h}"
                                th:data-cellkey="${d.diaSemana + '-' + h}"
                                th:data-materias="${bloquesMaterias?.get(d.diaSemana + '-' + h) != null ? #strings.listJoin(bloquesMaterias?.get(d.diaSemana + '-' + h), ',') : ''}"
                                th:classappend="${#sets.contains(bloquesPorDia?.get(d.diaSemana), h) ? 'sg-active' : ''}">
                                <span class="sg-cell-content"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Legend -->
            <div class="sg-legend">
                <span class="sg-legend-item">
                    <span class="sg-legend-swatch"></span> No disponible
                </span>
                <span class="sg-legend-item">
                    <span class="sg-legend-swatch available"></span> Disponible
                </span>
                <span class="sg-legend-item">
                    <span class="sg-legend-swatch reserved"></span> Reservado
                </span>
            </div>
        </div>

        <span id="sgSemanaInicio" th:attr="data-semana-inicio=${semanaInicio}" style="display:none"></span>

        <!-- Materias Modal -->
        <div class="modal fade" id="materiasModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            Materias &mdash; <span id="modalCellLabel"></span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div th:if="${#lists.isEmpty(tutorMaterias)}" class="text-muted small text-center py-2">
                            No tienes materias registradas.
                            <a th:href="@{/tutor/perfil}" class="d-block mt-1">Agregar materias</a>
                        </div>
                        <div th:unless="${#lists.isEmpty(tutorMaterias)}" id="materiasList">
                            <div th:each="tm : ${tutorMaterias}" class="form-check sg-mat-item">
                                <input type="checkbox" class="form-check-input sg-mat-check"
                                       th:id="'mat-' + ${tm.id}" th:value="${tm.id}">
                                <label class="form-check-label sg-mat-label"
                                       th:for="'mat-' + ${tm.id}">
                                    <span class="sg-mat-name" th:text="${tm.materia.nombre}">Matem\u00e1ticas</span>
                                    <span class="sg-mat-cat" th:text="${tm.materia.categoria}">Ciencias</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer" th:unless="${#lists.isEmpty(tutorMaterias)}">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary btn-sm" id="btnConfirmMaterias">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            (function() {
                var table = document.getElementById('sgTable');
                var btnGuardar = document.getElementById('btnGuardar');
                var btnLimpiar = document.getElementById('btnLimpiar');
                var sgToast = document.getElementById('sgToast');
                var materiasModal = document.getElementById('materiasModal');
                var modalLabel = document.getElementById('modalCellLabel');
                var btnConfirm = document.getElementById('btnConfirmMaterias');
                var materiasList = document.getElementById('materiasList');

                if (!table) return;

                // ── Build materia name lookup from the modal checkboxes ──
                var materiaNames = {};
                if (materiasList) {
                    materiasList.querySelectorAll('.sg-mat-item').forEach(function(item) {
                        var cb = item.querySelector('.sg-mat-check');
                        var nameEl = item.querySelector('.sg-mat-name');
                        if (cb && nameEl) {
                            materiaNames[parseInt(cb.value)] = nameEl.textContent.trim();
                        }
                    });
                }

                // ── State ──
                var celdaMaterias = {};  // key "1-8" -> [tutorMateriaId, ...]
                var pendingKey = null;
                var pendingWasActive = false;
                var pendingPrevIds = [];
                var saveSvgIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';

                // Load initial materias from data attributes
                table.querySelectorAll('.sg-cell[data-cellkey]').forEach(function(cell) {
                    var key = cell.getAttribute('data-cellkey');
                    var raw = cell.getAttribute('data-materias') || '';
                    if (raw) {
                        celdaMaterias[key] = raw.split(',').map(Number);
                    }
                });

                // Dias array for labels
                var diasNombres = ['Lun', 'Mar', 'Mi\u00e9', 'Jue', 'Vie', 'S\u00e1b', 'Dom'];

                // ── Helpers ──
                function getCellKey(cell) {
                    return cell.getAttribute('data-cellkey');
                }

                function cellKeyToLabel(key) {
                    var parts = key.split('-');
                    var dia = parseInt(parts[0]);
                    var hora = parseInt(parts[1]);
                    return (diasNombres[dia - 1] || '?') + ' a las ' + hora + ':00';
                }

                function getMateriaLabel(ids) {
                    if (!ids || ids.length === 0) return '';
                    var names = ids.map(function(id) {
                        return materiaNames[id] || ('Materia #' + id);
                    });
                    return names.join(', ');
                }

                function getActiveCells() {
                    var cells = [];
                    table.querySelectorAll('.sg-cell.sg-active').forEach(function(cell) {
                        if (cell.classList.contains('sg-reserved')) return;
                        var key = getCellKey(cell);
                        cells.push({
                            diaSemana: parseInt(cell.getAttribute('data-dia')),
                            hora: parseInt(cell.getAttribute('data-hora')),
                            materiaIds: celdaMaterias[key] || []
                        });
                    });
                    return cells;
                }

                function updateGuardarBtn() {
                    var cells = getActiveCells();
                    btnGuardar.disabled = cells.length === 0;
                }

                function setCellActive(cell, active, ids) {
                    var contentEl = cell.querySelector('.sg-cell-content');
                    if (active && ids && ids.length > 0) {
                        cell.classList.add('sg-active');
                        var label = getMateriaLabel(ids);
                        contentEl.textContent = label;
                        contentEl.title = label;
                    } else {
                        cell.classList.remove('sg-active');
                        contentEl.textContent = '';
                        contentEl.title = '';
                    }
                }

                function showToast(message, isError) {
                    sgToast.textContent = message;
                    sgToast.className = 'sg-toast ' + (isError ? 'sg-toast-error' : 'sg-toast-success');
                    sgToast.style.display = '';
                    // Trigger reflow for animation
                    sgToast.offsetHeight;
                    sgToast.classList.add('sg-toast-visible');
                    setTimeout(function() {
                        sgToast.classList.remove('sg-toast-visible');
                        setTimeout(function() { sgToast.style.display = 'none'; }, 350);
                    }, 3000);
                }

                // ── Render initial cell content ──
                table.querySelectorAll('.sg-cell.sg-active').forEach(function(cell) {
                    var key = getCellKey(cell);
                    var ids = celdaMaterias[key] || [];
                    setCellActive(cell, true, ids);
                });

                // ── Modal handlers ──
                function openMateriasModal(cell) {
                    var key = getCellKey(cell);
                    pendingKey = key;
                    pendingWasActive = cell.classList.contains('sg-active');
                    pendingPrevIds = celdaMaterias[key] ? celdaMaterias[key].slice() : [];

                    modalLabel.textContent = cellKeyToLabel(key);

                    // Check/uncheck based on current selection
                    var currentIds = celdaMaterias[key] || [];
                    materiasList.querySelectorAll('.sg-mat-check').forEach(function(cb) {
                        cb.checked = currentIds.indexOf(parseInt(cb.value)) !== -1;
                    });

                    var modal = new bootstrap.Modal(materiasModal);
                    modal.show();
                }

                btnConfirm.addEventListener('click', function() {
                    if (!pendingKey) return;

                    // Read checked checkboxes
                    var selectedIds = [];
                    materiasList.querySelectorAll('.sg-mat-check:checked').forEach(function(cb) {
                        selectedIds.push(parseInt(cb.value));
                    });

                    var cell = table.querySelector('.sg-cell[data-cellkey="' + pendingKey + '"]');
                    if (cell) {
                        if (selectedIds.length > 0) {
                            celdaMaterias[pendingKey] = selectedIds;
                            setCellActive(cell, true, selectedIds);
                        } else {
                            delete celdaMaterias[pendingKey];
                            setCellActive(cell, false, []);
                        }
                    }

                    updateGuardarBtn();

                    var modal = bootstrap.Modal.getInstance(materiasModal);
                    if (modal) modal.hide();
                    pendingKey = null;
                });

                materiasModal.addEventListener('hidden.bs.modal', function() {
                    if (pendingKey) {
                        // User dismissed without confirming — revert
                        var cell = table.querySelector('.sg-cell[data-cellkey="' + pendingKey + '"]');
                        if (cell) {
                            if (pendingWasActive) {
                                celdaMaterias[pendingKey] = pendingPrevIds;
                                setCellActive(cell, pendingPrevIds.length > 0, pendingPrevIds);
                            } else {
                                delete celdaMaterias[pendingKey];
                                setCellActive(cell, false, []);
                            }
                        }
                        updateGuardarBtn();
                        pendingKey = null;
                    }
                });

                // ── Cell click ──
                table.addEventListener('click', function(e) {
                    var cell = e.target.closest('.sg-cell');
                    if (!cell || cell.classList.contains('sg-reserved')) return;
                    openMateriasModal(cell);
                });

                // ── Guardar ──
                btnGuardar.addEventListener('click', function() {
                    var cells = getActiveCells();
                    if (cells.length === 0) return;

                    btnGuardar.disabled = true;
                    btnGuardar.classList.add('sg-btn-saving');

                    fetch('/tutor/disponibilidad/semanal/guardar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            semanaInicio: document.getElementById('sgSemanaInicio').getAttribute('data-semana-inicio'),
                            bloques: cells
                        })
                    })
                    .then(function(r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function(data) {
                        if (data.success) {
                            showToast('\u2713 Cambios guardados correctamente', false);
                        } else {
                            showToast('Error: ' + (data.error || 'desconocido'), true);
                        }
                    })
                    .catch(function(err) {
                        showToast('Error de conexi\u00f3n al guardar', true);
                    })
                    .finally(function() {
                        btnGuardar.classList.remove('sg-btn-saving');
                        updateGuardarBtn();
                    });
                });

                // ── Limpiar ──
                btnLimpiar.addEventListener('click', function() {
                    if (!confirm('\u00bfLimpiar toda la disponibilidad de esta semana?')) return;

                    btnLimpiar.disabled = true;
                    btnLimpiar.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Limpiando...';

                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/tutor/disponibilidad/semanal/limpiar';
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'semana';
                    input.value = document.getElementById('sgSemanaInicio').getAttribute('data-semana-inicio');
                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                });

                // ── Init ──
                updateGuardarBtn();
            })();
        </script>
    </th:block>
</body>
</html>
