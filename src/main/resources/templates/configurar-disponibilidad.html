<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Disponibilidad Horaria'">
<head>
<body>
    <th:block layout:fragment="content">
        <div class="sg-wrapper">
            <!-- Header -->
            <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
                <div>
                    <h1 class="fw-bold mb-1">
                        <i class="bi bi-calendar-week me-2"></i>Disponibilidad Semanal
                    </h1>
                    <p class="text-muted mb-0">Selecciona los bloques de 1 hora en los que estar&aacute;s disponible.</p>
                </div>
            </div>

            <!-- Week navigation -->
            <div class="sg-nav">
                <a th:href="@{/tutor/disponibilidad/semanal(semana=${semanaAnterior})}" class="sg-nav-btn">
                    <i class="bi bi-chevron-left"></i> Semana anterior
                </a>
                <div class="sg-week-label">
                    <span th:text="${semanaRango}">07 – 13 jul, 2026</span>
                    <small th:if="${esSemanaActual}">Semana actual</small>
                </div>
                <a th:href="@{/tutor/disponibilidad/semanal(semana=${semanaSiguiente})}" class="sg-nav-btn">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </a>
            </div>

            <!-- Actions -->
            <div class="sg-actions">
                <button class="sg-btn sg-btn-danger" id="btnLimpiar">
                    <i class="bi bi-trash3"></i> Limpiar Todo
                </button>
                <button class="sg-btn sg-btn-primary" id="btnGuardar" disabled>
                    <i class="bi bi-check2"></i> Guardar Cambios
                </button>
                <span id="sgSavedBadge" style="display:none"></span>
            </div>

            <!-- Grid -->
            <div class="sg-table-wrap">
                <table class="sg-table" id="sgTable">
                    <thead>
                        <tr>
                            <th class="sg-th-hour">Hora</th>
                            <th th:each="d : ${diasInfo}"
                                class="sg-th-day"
                                th:classappend="${d.esHoy} ? 'sg-th-today' : ''">
                                <span class="sg-day-name" th:text="${d.nombre}">Lun</span>
                                <span class="sg-day-date" th:text="${d.fecha}">07/07</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="h : ${horas}">
                            <td class="sg-td-hour" th:text="${h} + ':00'">07:00</td>
                            <td th:each="d : ${diasInfo}"
                                class="sg-cell"
                                th:data-dia="${d.diaSemana}"
                                th:data-hora="${h}"
                                th:classappend="${bloquesPorDia?.get(d.diaSemana)?.contains(h) ? 'sg-active' : ''}">
                                <span class="sg-cell-icon">
                                    <i th:if="${bloquesPorDia?.get(d.diaSemana)?.contains(h)}" class="bi bi-check-lg"></i>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Legend -->
            <div class="sg-legend">
                <span class="sg-legend-item">
                    <span class="sg-legend-swatch"></span> No disponible
                </span>
                <span class="sg-legend-item">
                    <span class="sg-legend-swatch available"></span> Disponible
                </span>
                <span class="sg-legend-item">
                    <span class="sg-legend-swatch reserved"></span> Reservado
                </span>
            </div>
        </div>

        <script>
            (function() {
                var table = document.getElementById('sgTable');
                var btnGuardar = document.getElementById('btnGuardar');
                var btnLimpiar = document.getElementById('btnLimpiar');
                var savedBadge = document.getElementById('sgSavedBadge');

                if (!table) return;

                // ── Helpers ──
                function getActiveCells() {
                    var cells = [];
                    table.querySelectorAll('.sg-cell.sg-active').forEach(function(cell) {
                        if (cell.classList.contains('sg-reserved')) return;
                        cells.push({
                            diaSemana: parseInt(cell.getAttribute('data-dia')),
                            hora: parseInt(cell.getAttribute('data-hora'))
                        });
                    });
                    return cells;
                }

                function hasChanges() {
                    return getActiveCells().length > 0;
                }

                function updateGuardarBtn() {
                    var cells = getActiveCells();
                    btnGuardar.disabled = cells.length === 0;
                    btnGuardar.innerHTML = '<i class="bi bi-check2"></i> Guardar Cambios' +
                        (cells.length > 0 ? ' (' + cells.length + ')' : '');
                }

                // ── Toggle cell ──
                table.addEventListener('click', function(e) {
                    var cell = e.target.closest('.sg-cell');
                    if (!cell || cell.classList.contains('sg-reserved')) return;
                    cell.classList.toggle('sg-active');
                    var icon = cell.querySelector('.sg-cell-icon');
                    if (cell.classList.contains('sg-active')) {
                        icon.innerHTML = '<i class="bi bi-check-lg"></i>';
                    } else {
                        icon.innerHTML = '';
                    }
                    updateGuardarBtn();
                    savedBadge.style.display = 'none';
                });

                // ── Guardar ──
                btnGuardar.addEventListener('click', function() {
                    var cells = getActiveCells();
                    if (cells.length === 0) return;

                    btnGuardar.disabled = true;
                    btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Guardando...';

                    fetch('/tutor/disponibilidad/semanal/guardar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            semanaInicio: getSemanaInicio(),
                            bloques: cells
                        })
                    })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.success) {
                            savedBadge.className = 'sg-saved-badge';
                            savedBadge.innerHTML = '<i class="bi bi-check-circle-fill"></i> Guardado';
                            savedBadge.style.display = '';
                            setTimeout(function() {
                                savedBadge.style.display = 'none';
                            }, 3000);
                        } else {
                            alert('Error: ' + (data.error || 'desconocido'));
                        }
                    })
                    .catch(function() {
                        alert('Error de conexi\u00f3n al guardar');
                    })
                    .finally(function() {
                        updateGuardarBtn();
                    });
                });

                var semanaInicioActual = '[[${semanaInicio}]]';

                function getSemanaInicio() {
                    return semanaInicioActual;
                }

                // ── Limpiar ──
                btnLimpiar.addEventListener('click', function() {
                    if (!confirm('\u00bfLimpiar toda la disponibilidad de esta semana?')) return;

                    btnLimpiar.disabled = true;
                    btnLimpiar.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Limpiando...';

                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/tutor/disponibilidad/semanal/limpiar';
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'semana';
                    input.value = getSemanaInicio();
                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                });

                // ── Init ──
                updateGuardarBtn();
            })();
        </script>

        <meta name="semana-inicio" th:content="${semanaInicio}">
    </th:block>
</body>
</html>
