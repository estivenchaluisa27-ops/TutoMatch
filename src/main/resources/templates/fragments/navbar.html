<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar(authenticated, isAdmin)" class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top" style="background-color: var(--brand-purple);" role="navigation" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" aria-label="TutoMatch - Inicio">
                <i class="bi bi-mortarboard-fill me-2"></i><span class="nav-brand-tuto">Tuto</span><span class="nav-brand-match">Match</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <!-- Usuario NO autenticado -->
                    <li th:if="${not authenticated}" class="nav-item">
                        <a class="btn btn-outline-primary" href="/auth/login" role="button">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                        </a>
                    </li>
                    <li th:if="${not authenticated}" class="nav-item">
                        <a class="btn btn-primary" href="/auth/registro" role="button">
                            <i class="bi bi-person-plus me-1"></i>Registrarse
                        </a>
                    </li>

                    <!-- Badge de tokens (solo usuarios no admin) -->
                    <li th:if="${authenticated && !isAdmin}" class="nav-item">
                        <a href="/wallet" class="nav-link d-flex align-items-center gap-1" aria-label="Mis tokens">
                            <i class="bi bi-coin text-warning"></i>
                            <span class="badge bg-warning text-dark fw-bold" th:text="${saldoTokens}">0</span>
                        </a>
                    </li>

                    <!-- Campana de notificaciones (solo usuarios no admin) -->
                    <li th:if="${authenticated && !isAdmin}" class="nav-item position-relative">
                        <button class="notif-bell" id="notifBell" aria-label="Notificaciones">
                            <i class="bi bi-bell"></i>
                            <span class="notif-badge"
                                  id="notifBadge"
                                  th:text="${notificacionesNoLeidas}"
                                  th:style="${notificacionesNoLeidas > 0} ? '' : 'display:none'">0</span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end notif-dropdown" id="notifDropdown" aria-labelledby="notifBell">
                            <div class="notif-header">
                                <h6>Notificaciones</h6>
                                <button class="btn btn-link btn-sm" id="marcarLeidasBtn" onclick="marcarTodasLeidas()">Marcar todas le&iacute;das</button>
                            </div>
                            <div id="notifList">
                                <div class="notif-empty">
                                    <i class="bi bi-bell-slash"></i>
                                    <p>Cargando...</p>
                                </div>
                            </div>
                        </div>
                    </li>

                    <!-- Dark Mode Toggle -->
                    <li class="nav-item">
                        <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Alternar modo oscuro">
                            <span class="toggle-indicator"></span>
                            <svg class="toggle-icon toggle-moon" id="toggleMoon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="m15 8l-3-3l3-3l3 3z"/>
                                <path d="m20 11l-2-2l2-2l2 2z"/>
                                <path d="M12.075 22q-2.1 0-3.937-.8t-3.2-2.162t-2.163-3.2t-.8-3.938q0-3.65 2.325-6.437T10.225 2q-.45 2.475.275 4.838t2.5 4.137t4.138 2.5t4.837.275q-.65 3.6-3.45 5.925T12.075 22"/>
                            </svg>
                            <svg class="toggle-icon toggle-sun" id="toggleSun" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M18 12a6 6 0 1 1-12 0a6 6 0 0 1 12 0"/>
                                <path fill-rule="evenodd" d="M12 1.25a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0V2a.75.75 0 0 1 .75-.75M4.399 4.399a.75.75 0 0 1 1.06 0l.393.392a.75.75 0 0 1-1.06 1.061l-.393-.393a.75.75 0 0 1 0-1.06m15.202 0a.75.75 0 0 1 0 1.06l-.393.393a.75.75 0 0 1-1.06-1.06l.393-.393a.75.75 0 0 1 1.06 0M1.25 12a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5H2a.75.75 0 0 1-.75-.75m19 0a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5h-1a.75.75 0 0 1-.75-.75m-2.102 6.148a.75.75 0 0 1 1.06 0l.393.393a.75.75 0 1 1-1.06 1.06l-.393-.393a.75.75 0 0 1 0-1.06m-12.296 0a.75.75 0 0 1 0 1.06l-.393.393a.75.75 0 1 1-1.06-1.06l.392-.393a.75.75 0 0 1 1.061 0M12 20.25a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1a.75.75 0 0 1 .75-.75" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </li>

                    <!-- Usuario autenticado (NO admin) -->
                    <li th:if="${authenticated && !isAdmin}" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person fs-4"></i>
                            <span class="d-none d-md-inline">Mi Cuenta</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="/reservas"><i class="bi bi-book me-2"></i>Mis Tutorías</a></li>
                            <li><a class="dropdown-item" href="/wallet"><i class="bi bi-coin me-2"></i>Mi Wallet</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/tutor/mi-perfil"><i class="bi bi-eye me-2"></i>Ver Mi Perfil</a></li>
                            <li><a class="dropdown-item" href="/tutor/perfil"><i class="bi bi-pencil me-2"></i>Editar Perfil</a></li>
                            <li><a class="dropdown-item" href="/tutor/disponibilidad"><i class="bi bi-calendar-week me-2"></i>Disponibilidad</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <button id="logoutBtn" class="dropdown-item text-danger" aria-label="Cerrar sesión">
                                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                                </button>
                            </li>
                        </ul>
                    </li>

                    <!-- Usuario autenticado (admin) -->
                    <li th:if="${authenticated && isAdmin}" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-shield fs-4"></i>
                            <span class="d-none d-md-inline">Administrador</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminDropdown">
                            <li><a class="dropdown-item" href="/admin"><i class="bi bi-grid-3x3-gap me-2"></i>Panel de Administración</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <button id="logoutBtn" class="dropdown-item text-danger" aria-label="Cerrar sesión">
                                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                                </button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
