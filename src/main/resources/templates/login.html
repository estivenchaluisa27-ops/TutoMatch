<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | TutoMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --brand: #0d9488; --bg-chalkboard: #234b3a; }

        body {
            background-color: var(--bg-chalkboard);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden;
        }

        .chalk-drawing { position: absolute; color: rgba(255, 255, 255, 0.15); pointer-events: none; z-index: 0; }
        .fullscreen-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; position: relative; z-index: 1; }

        .brand-title { font-size: 4.5rem; font-weight: 800; color: #ffffff; font-family: 'Comic Sans MS', sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .motivation-phrase { font-size: 1.3rem; font-style: italic; color: rgba(255, 255, 255, 0.9); max-width: 80%; }

        .login-card { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 3rem; backdrop-filter: blur(8px); width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.4); }

        /* Corrección de color en placeholders */
        .form-control { background: transparent !important; border: none !important; border-bottom: 1px solid rgba(255, 255, 255, 0.5) !important; color: white !important; border-radius: 0; }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.7) !important; opacity: 1; }
        .form-control:focus { border-color: var(--brand) !important; box-shadow: 0 1px 0 var(--brand) !important; }

        .btn-primary { background-color: var(--brand) !important; border: none !important; padding: 0.8rem; font-weight: 600; }

        @media (max-width: 992px) { .chalk-drawing { display: none; } }
    </style>
</head>
<body>

<!-- Figuras dispersas por todo el fondo -->
<i class="bi bi-code-slash chalk-drawing" style="font-size: 4rem; top: 10%; left: 5%; transform: rotate(-20deg);"></i>
<i class="bi bi-calculator chalk-drawing" style="font-size: 3rem; top: 15%; right: 10%;"></i>
<i class="bi bi-graph-up chalk-drawing" style="font-size: 3.5rem; top: 60%; left: 15%;"></i>
<i class="bi bi-braces chalk-drawing" style="font-size: 4rem; bottom: 10%; right: 20%; transform: rotate(10deg);"></i>
<i class="bi bi-infinity chalk-drawing" style="font-size: 3rem; bottom: 15%; left: 8%;"></i>

<div class="fullscreen-wrapper">
    <div class="row w-100 align-items-center" style="max-width: 1100px;">

        <div class="col-lg-6 text-center text-lg-start mb-5 mb-lg-0">
            <a href="/" class="text-decoration-none">
                <!-- Birrete añadido -->
                <i class="bi bi-mortarboard-fill mb-2 d-block" style="font-size: 3rem; color: var(--brand);"></i>
                <h1 class="brand-title">TutoMatch</h1>
            </a>
            <p class="motivation-phrase mt-3">"Tu potencial no tiene límites. Conecta con quienes comparten tu visión y domina cada reto académico juntos."</p>
        </div>

        <div class="col-lg-5 mx-auto">
            <div class="login-card">
                <h3 class="text-center fw-bold mb-4">Iniciar Sesión</h3>
                <form id="loginForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Correo Institucional</label>
                        <input type="email" name="correoInstitucional" class="form-control" placeholder="usuario@uce.edu.ec" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div id="loginError" class="alert alert-danger d-none p-2 small"></div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <div class="text-center mt-4 pt-3 border-top border-light border-opacity-25">
                    <p class="text-white-50 small mb-0">¿No tienes cuenta?</p>
                    <a href="/auth/registro" class="text-white fw-bold text-decoration-none" style="border-bottom: 2px solid var(--brand);">Regístrate ahora</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
