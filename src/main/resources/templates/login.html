<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | TutoMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="/" class="text-decoration-none">
                                <i class="bi bi-mortarboard-fill fs-1 text-primary"></i>
                                <h1 class="h3 fw-bold text-primary mt-2">TutoMatch</h1>
                            </a>
                            <p class="text-muted">Ingresa tus credenciales</p>
                        </div>

                        <form id="loginForm" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="correoInstitucional" class="form-label fw-semibold">Correo Institucional</label>
                                <input type="email" name="correoInstitucional" class="form-control" id="correoInstitucional" 
                                       placeholder="usuario@uce.edu.ec" required>
                                <div class="invalid-feedback">El correo institucional es obligatorio</div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" name="password" class="form-control" id="password" 
                                       placeholder="Tu contraseña" required>
                                <div class="invalid-feedback">La contraseña es obligatoria</div>
                            </div>

                            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">¿No tienes cuenta?</p>
                            <a href="/auth/registro" class="text-primary text-decoration-none fw-semibold">Regístrate ahora</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            if (!this.checkValidity()) { this.classList.add('was-validated'); return; }

            const data = {
                correoInstitucional: this.correoInstitucional.value,
                password: this.password.value
            };

            const errorDiv = document.getElementById('loginError');
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    const result = await response.json();
                    errorDiv.textContent = result.error || 'Credenciales inválidas';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
