<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Mi Perfil'">
<head>
<body>
    <th:block layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 96px; height: 96px; font-size: 2.5rem; font-weight: bold;">
                            <span th:text="${#strings.substring(usuario.nombreCompleto, 0, 1)}">I</span>
                        </div>
                        <h4 class="fw-bold" th:text="${usuario.nombreCompleto}">Nombre</h4>
                        <p class="text-muted mb-2">
                            <i class="bi bi-envelope me-1"></i><span th:text="${usuario.correoInstitucional}">correo@uce.edu.ec</span>
                        </p>
                        <p class="text-muted small mb-0">
                            <i class="bi bi-calendar me-1"></i>Miembro desde <span th:text="${#temporals.format(usuario.fechaCreacion, 'dd/MM/yyyy')}">01/01/2026</span>
                        </p>
                    </div>
                </div>

                <div class="card shadow-sm mt-3">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-shield-check me-2"></i>Roles
                    </div>
                    <div class="card-body">
                        <span th:if="${usuario.rolTutor}" class="badge bg-success me-1"><i class="bi bi-mortarboard me-1"></i>Tutor</span>
                        <span th:if="${usuario.rolSolicitante}" class="badge bg-info me-1"><i class="bi bi-person me-1"></i>Solicitante</span>
                        <span th:if="${usuario.rolAdmin}" class="badge bg-warning text-dark me-1"><i class="bi bi-shield-lock me-1"></i>Admin</span>
                        <span th:if="${not usuario.rolTutor and not usuario.rolSolicitante and not usuario.rolAdmin}" class="text-muted small">Sin roles asignados</span>
                    </div>
                </div>

                <div th:if="${perfilTutor != null}" class="card shadow-sm mt-3">
                    <div class="card-header bg-white fw-bold">
                        <i class="bi bi-person-badge me-2"></i>Perfil de Tutor
                    </div>
                    <div class="card-body">
                        <p class="mb-2"><strong>Semestre:</strong> <span th:text="${perfilTutor.semestre}">5</span></p>
                        <p class="mb-2"><strong>Calificación:</strong>
                            <i class="bi bi-star-fill text-warning"></i>
                            <span th:text="${perfilTutor.calificacionPromedio}">5.0</span>
                        </p>
                        <p class="mb-2" th:if="${perfilTutor.verificado}">
                            <span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Verificado</span>
                        </p>
                        <p class="mb-2" th:unless="${perfilTutor.verificado}">
                            <span class="badge bg-warning text-dark"><i class="bi bi-hourglass me-1"></i>Pendiente de verificación</span>
                        </p>
                        <a th:href="@{'/tutor/' + ${perfilTutor.id}}" class="btn btn-outline-primary btn-sm mt-2">
                            <i class="bi bi-eye me-1"></i>Ver perfil público
                        </a>
                        <a href="/tutor/perfil" class="btn btn-outline-secondary btn-sm mt-2 ms-1">
                            <i class="bi bi-pencil me-1"></i>Editar perfil
                        </a>
                    </div>
                </div>

                <div th:if="${perfilTutor == null}" class="card shadow-sm mt-3">
                    <div class="card-body text-center py-4">
                        <i class="bi bi-person-x fs-1 text-muted d-block mb-2"></i>
                        <p class="mb-2">No tienes un perfil de tutor.</p>
                        <a href="/auth/registro" class="btn btn-primary">
                            <i class="bi bi-mortarboard me-1"></i>Registrarse como tutor
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
