<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Moderación de Reseñas'">
<head>
<body>
    <th:block layout:fragment="content">
        <div class="row">
            <div class="col-12 mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin" class="text-decoration-none">Panel</a></li>
                        <li class="breadcrumb-item active">Rese&ntilde;as</li>
                    </ol>
                </nav>
                <h1 class="fw-bold">
                    <i class="bi bi-star me-2"></i>Moderaci&oacute;n de Rese&ntilde;as
                </h1>
                <p class="text-muted">Revisa y elimina rese&ntilde;as inapropiadas o abusivas.</p>
            </div>

            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold">
                            <i class="bi bi-chat-quote me-2"></i>Todas las Rese&ntilde;as
                            <span class="badge bg-info ms-2" th:text="${#lists.size(resenas)}">0</span>
                        </span>
                    </div>
                    <div class="card-body p-0">
                        <div th:if="${#lists.isEmpty(resenas)}" class="text-center text-muted py-5">
                            <i class="bi bi-star fs-1 d-block mb-2"></i>
                            <p class="mb-0">No hay rese&ntilde;as registradas.</p>
                        </div>

                        <div th:unless="${#lists.isEmpty(resenas)}" class="table-responsive">
                            <table class="table table-hover mb-0" aria-label="Rese\u00f1as registradas">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Solicitante</th>
                                        <th>Tutor</th>
                                        <th>Calificaci&oacute;n</th>
                                        <th>Comentario</th>
                                        <th>Fecha</th>
                                        <th>Acci&oacute;n</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="r : ${resenas}">
                                        <td th:text="${r.id}">1</td>
                                        <td th:text="${r.reserva.solicitante.nombreCompleto}">Solicitante</td>
                                        <td th:text="${r.reserva.disponibilidad.perfilTutor.usuario.nombreCompleto}">Tutor</td>
                                        <td>
                                            <span th:each="i : ${#numbers.sequence(1, 5)}" th:inline="text">
                                                <i th:if="${i <= r.calificacion}" class="bi bi-star-fill text-warning"></i>
                                                <i th:unless="${i <= r.calificacion}" class="bi bi-star text-warning"></i>
                                            </span>
                                            <span class="ms-1 small" th:text="'(' + ${r.calificacion} + '/5)'">(5/5)</span>
                                        </td>
                                        <td class="small" style="max-width: 250px;">
                                            <span th:text="${r.comentario}">Comentario</span>
                                            <span th:if="${r.comentario == null || r.comentario.isEmpty()}" class="text-muted fst-italic">Sin comentario</span>
                                        </td>
                                        <td class="small" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</td>
                                        <td>
                                            <form th:action="@{/admin/resenas/{id}/eliminar(id=${r.id})}" method="post"
                                                  onsubmit="return confirm('¿Eliminar esta reseña permanentemente?')">
                                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                                    <i class="bi bi-trash me-1"></i>Eliminar
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
