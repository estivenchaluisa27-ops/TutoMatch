<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | TutoMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --brand: #0d9488;
            --bg-chalkboard: #234b3a;
        }

        body {
            background-color: var(--bg-chalkboard);
            /* Textura sutil simulando el polvo de la tiza en la pizarra */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== DECORACIONES DE TIZA (MATERIAS) ===== */
        .chalk-drawing {
            position: absolute;
            color: rgba(255, 255, 255, 0.12); /* Blanco semi-transparente como tiza borrosa */
            pointer-events: none; /* Evita que estorben al hacer clic */
            z-index: 0;
        }

        .fullscreen-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            z-index: 1;
        }

        .content-layout {
            max-width: 1200px;
            width: 100%;
        }

        /* ===== ESTILOS DEL TEXTO ===== */
        .text-column {
            padding: 2rem 1rem 2rem 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .brand-title {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', sans-serif;
        }

        .brand-phrase {
            font-size: 1.25rem;
            font-style: italic;
            font-family: 'Georgia', serif;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.8;
            max-width: 95%;
        }

        /* ===== ESTILOS DEL FORMULARIO ===== */
        .form-column {
            padding: 1rem 0;
            display: flex;
            align-items: center;
        }

        .registration-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        .form-control {
            background-color: transparent !important;
            border: none !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5) !important;
            border-radius: 0;
            color: white !important;
            padding-left: 0;
            padding-right: 0;
            margin-bottom: 0.5rem;
        }

        .form-control:focus {
            border-color: var(--brand) !important;
            box-shadow: 0 1px 0 0 var(--brand) !important;
        }

        .form-control::placeholder { color: rgba(255, 255, 255, 0.6); }

        .form-label {
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-check:checked + .btn-outline-light {
            background-color: var(--brand) !important;
            border-color: var(--brand) !important;
            color: white !important;
            font-weight: bold;
        }

        .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
        }

        .btn-outline-light:hover { background-color: rgba(255, 255, 255, 0.1); color: #ffffff; }

        .btn-primary {
            background-color: var(--brand) !important;
            border: none !important;
            padding: 0.8rem;
            font-weight: 600;
        }

        .btn-primary:hover { background-color: #0f766e !important; }

        @media (max-width: 992px) {
            .text-column { padding: 1rem; text-align: center; margin-bottom: 2rem; }
            .brand-phrase { max-width: 100%; margin: 0 auto; }
            .brand-title { font-size: 3.5rem; }
            .registration-card { padding: 2rem 1.5rem; }
            .chalk-drawing { display: none; }
        }
    </style>
</head>
<body>

<i class="bi bi-code-slash chalk-drawing" style="font-size: 3.5rem; top: 15%; left: 8%; transform: rotate(-15deg);"></i>
<i class="bi bi-calculator chalk-drawing" style="font-size: 2.5rem; top: 22%; left: 42%; transform: rotate(10deg);"></i>
<i class="bi bi-infinity chalk-drawing" style="font-size: 3rem; bottom: 20%; left: 10%; transform: rotate(-5deg);"></i>
<i class="bi bi-lightning-charge chalk-drawing" style="font-size: 4rem; bottom: 12%; right: 44%; transform: rotate(15deg); opacity: 0.08;"></i>
<i class="bi bi-braces chalk-drawing" style="font-size: 3rem; top: 10%; right: 15%; transform: rotate(20deg);"></i>

<div class="fullscreen-wrapper">
    <div class="content-layout row g-0 justify-content-between align-items-center">

        <!-- Reemplaza tu bloque actual de la columna de texto por este -->
        <div class="col-lg-6 col-md-6 text-column">
            <div>
                <i class="bi bi-mortarboard-fill mb-3 d-block" style="font-size: 3.5rem; color: var(--brand);"></i>

                <!-- Aquí está el cambio: envuelto en un <a> con href hacia tu página de inicio -->
                <a href="/" style="text-decoration: none;">
                    <h1 class="brand-title">TutoMatch</h1>
                </a>

                <p class="brand-phrase">
                    "Conecta, aprende y domina tus materias. Encuentra al tutor ideal para superar tus retos académicos, o comparte tus conocimientos con la comunidad de la UCE."
                </p>
            </div>
        </div>
        <div class="col-lg-5 col-md-6 form-column">
            <div class="registration-card">
                <h3 class="text-center fw-bold mb-4 text-white">Registro</h3>

                <form id="registroForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="nombreCompleto" class="form-control" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Institucional</label>
                        <input type="email" name="correoInstitucional" class="form-control" placeholder="usuario@uce.edu.ec" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label class="form-label d-block mb-3">¿Cómo quieres participar?</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="checkbox" class="btn-check" id="btnS" checked>
                                <label class="btn btn-outline-light w-100" for="btnS">Busco tutorías</label>
                            </div>
                            <div class="col-6">
                                <input type="checkbox" class="btn-check" id="btnT">
                                <label class="btn btn-outline-light w-100" for="btnT">Soy tutor</label>
                            </div>
                        </div>
                        <div id="rolError" class="text-danger small mt-2 d-none">Selecciona al menos una opción.</div>
                    </div>

                    <div id="registroError" class="alert alert-danger d-none small p-2" role="alert"></div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Crear mi cuenta</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-light border-opacity-25">
                    <p class="text-white-50 small mb-0">¿Ya tienes una cuenta?</p>
                    <a href="/auth/login" class="text-white text-decoration-none fw-bold" style="border-bottom: 2px solid var(--brand);">Inicia sesión aquí</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('registroForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        if (!this.checkValidity()) {
            this.classList.add('was-validated');
            return;
        }

        const esSolicitante = document.getElementById('btnS').checked;
        const esTutor = document.getElementById('btnT').checked;

        if (!esSolicitante && !esTutor) {
            document.getElementById('rolError').classList.remove('d-none');
            return;
        }
        document.getElementById('rolError').classList.add('d-none');

        const formData = new FormData(this);
        const data = {
            correoInstitucional: formData.get('correoInstitucional'),
            password: formData.get('password'),
            nombreCompleto: formData.get('nombreCompleto'),
            rolSolicitante: esSolicitante,
            rolTutor: esTutor
        };

        const errorDiv = document.getElementById('registroError');
        try {
            const response = await fetch('/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                window.location.href = '/';
            } else {
                const result = await response.json();
                errorDiv.textContent = result.error || 'Error al registrarse';
                errorDiv.classList.remove('d-none');
            }
        } catch (err) {
            errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
            errorDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
