<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Buscar Tutores'">
<head>
<body>
    <th:block layout:fragment="content">
        <div class="row stagger-fade stagger-fade-1">
            <div class="col-12 mb-4">
                <h1 class="fw-bold">
                    <i class="bi bi-search me-2"></i>Buscar Tutores
                </h1>
            </div>

            <!-- Filtros -->
            <div class="col-lg-3 mb-4 stagger-fade stagger-fade-2">
                <div class="card">
                    <div class="card-header fw-bold">
                        <i class="bi bi-funnel me-2"></i>Filtros
                    </div>
                    <div class="card-body">
                        <form th:action="@{/buscar}" method="get">
                            <div class="mb-3 position-relative">
                                <label for="materia" class="form-label fw-semibold">Materia o Categor&iacute;a</label>
                                <input type="text" id="materia" name="materia" class="form-control" th:value="${materia}" placeholder="Ej: Programaci\u00f3n" autocomplete="off">
                                <div id="sugerenciasDropdown" class="autocomplete-dropdown" style="display:none;"></div>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label fw-semibold">Categor&iacute;a</label>
                                <select id="categoria" name="categoria" class="form-select">
                                    <option value="">Todas</option>
                                    <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}" th:selected="${categoria == cat}">Categor\u00eda</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="minCalificacion" class="form-label fw-semibold">Calificaci&oacute;n m&iacute;nima</label>
                                <select id="minCalificacion" name="minCalificacion" class="form-select">
                                    <option value="">Cualquiera</option>
                                    <option value="4" th:selected="${minCalificacion != null && minCalificacion == 4}">4+ estrellas</option>
                                    <option value="3" th:selected="${minCalificacion != null && minCalificacion == 3}">3+ estrellas</option>
                                    <option value="2" th:selected="${minCalificacion != null && minCalificacion == 2}">2+ estrellas</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="semestre" class="form-label fw-semibold">Semestre</label>
                                <select id="semestre" name="semestre" class="form-select">
                                    <option value="">Cualquiera</option>
                                    <option th:each="s : ${semestres}" th:value="${s}" th:text="${s}" th:selected="${semestre == s}">Semestre</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search me-1"></i>Buscar
                            </button>
                            <a th:href="@{/buscar}" class="btn btn-outline-secondary w-100 mt-2">
                                <i class="bi bi-arrow-counterclockwise me-1"></i>Limpiar filtros
                            </a>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Resultados -->
            <div class="col-lg-9 stagger-fade stagger-fade-3">
                <div th:if="${#lists.isEmpty(resultados)}" class="card">
                    <div class="card-body text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                        <p class="mb-0">No se encontraron tutores con los filtros seleccionados.</p>
                        <p class="small">Prueba con t&eacute;rminos m&aacute;s generales o limpia los filtros.</p>
                    </div>
                </div>

                <div th:unless="${#lists.isEmpty(resultados)}">
                    <p class="text-muted mb-3">
                        <i class="bi bi-people me-1"></i>
                        <span th:text="${#lists.size(resultados)}">0</span> tutor(es) encontrado(s)
                    </p>
                    <div class="row row-cols-1 row-cols-md-2 g-3">
                        <div th:each="t : ${resultados}" class="col card-fade-in" th:style="'animation-delay: ' + (${t.id} * 0.04) + 's'">
                            <div class="card h-100">
                                <div class="card-body">
                                    <div class="d-flex align-items-center mb-2">
                                        <div class="avatar-circle me-3">
                                            <span th:text="${#strings.substring(t.usuario.nombreCompleto, 0, 1)}">I</span>
                                        </div>
                                        <div>
                                            <h6 class="fw-bold mb-0" th:text="${t.usuario.nombreCompleto}">Nombre</h6>
                                            <small class="text-muted" th:text="'Semestre ' + ${t.semestre}">Semestre</small>
                                        </div>
                                    </div>
                                    <p class="card-text small text-muted mb-2" th:text="${#strings.abbreviate(t.descripcion, 80)}">Descripción</p>
                                    <div class="d-flex align-items-center mb-2 star-rating">
                                        <span>
                                            <i class="bi bi-star-fill text-warning"></i>
                                            <span class="fw-semibold ms-1" th:text="${t.calificacionPromedio}">5.0</span>
                                        </span>
                                    </div>
                                    <a th:href="@{/tutor/{id}(id=${t.id})}" class="btn btn-outline-primary btn-sm w-100">
                                        Ver perfil completo
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
    <script>
        (function() {
            const input = document.getElementById('materia');
            const dropdown = document.getElementById('sugerenciasDropdown');
            const form = input?.closest('form');
            if (!input || !dropdown) return;

            let debounceTimer = null;
            let selectedIndex = -1;

            function showDropdown(items) {
                if (!items.length) { hideDropdown(); return; }
                selectedIndex = -1;
                dropdown.innerHTML = items.map((m, i) => `
                    <div class="autocomplete-item" data-index="${i}" data-nombre="${escapeHtml(m.nombre)}">
                        <i class="bi bi-book me-2 text-muted"></i>
                        <span class="fw-semibold">${escapeHtml(m.nombre)}</span>
                        <small class="text-muted ms-auto">${escapeHtml(m.categoria || '')}</small>
                    </div>
                `).join('');
                dropdown.style.display = 'block';
                dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
                    el.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        input.value = el.dataset.nombre;
                        hideDropdown();
                        form.submit();
                    });
                });
            }

            function hideDropdown() {
                dropdown.style.display = 'none';
                selectedIndex = -1;
            }

            function highlightItem(idx) {
                const items = dropdown.querySelectorAll('.autocomplete-item');
                items.forEach(el => el.classList.remove('active'));
                if (idx >= 0 && idx < items.length) {
                    items[idx].classList.add('active');
                    items[idx].scrollIntoView({ block: 'nearest' });
                }
            }

            function escapeHtml(s) {
                return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }

            input.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                const q = input.value.trim();
                if (q.length < 2) { hideDropdown(); return; }
                debounceTimer = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/buscar/sugerencias?q=${encodeURIComponent(q)}`);
                        if (res.ok) {
                            const data = await res.json();
                            showDropdown(data);
                        }
                    } catch (e) { hideDropdown(); }
                }, 150);
            });

            input.addEventListener('keydown', (e) => {
                const items = dropdown.querySelectorAll('.autocomplete-item');
                if (dropdown.style.display === 'none' || !items.length) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
                    highlightItem(selectedIndex);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIndex = Math.max(selectedIndex - 1, 0);
                    highlightItem(selectedIndex);
                } else if (e.key === 'Enter' && selectedIndex >= 0) {
                    e.preventDefault();
                    input.value = items[selectedIndex].dataset.nombre;
                    hideDropdown();
                    form.submit();
                } else if (e.key === 'Escape') {
                    hideDropdown();
                }
            });

            document.addEventListener('click', (e) => {
                if (!form.contains(e.target)) hideDropdown();
            });
        })();
    </script>
</body>
</html>
