        <div class="container text-center">
            <div class="hero-brand mb-4 stagger-fade stagger-fade-1">
                <div class="hero-brand-name">
                    <span class="hero-tuto">Tuto</span>
                    <span class="hero-match">Match</span>
                </div>
            </div>
            <p class="lead mb-4 stagger-fade stagger-fade-2">Conecta con tutores de la UCE y alcanza tu m&aacute;ximo potencial acad&eacute;mico.</p>

            <!-- Botones para usuarios no autenticados -->
            <div th:if="${not authenticated}" class="d-grid gap-2 d-sm-flex justify-content-sm-center stagger-fade stagger-fade-3">
                <a th:href="@{/auth/registro}" class="btn btn-light btn-lg px-4 gap-3">Empezar ahora</a>
                <a th:href="@{/auth/login}" class="btn btn-outline-light btn-lg px-4">Iniciar sesi&oacute;n</a>
            </div>

            <!-- Buscador integrado para usuarios autenticados -->
            <div th:if="${authenticated}" class="row justify-content-center stagger-fade stagger-fade-3">
                <div class="col-12 col-md-8 col-lg-6">
                    <form th:action="@{/buscar}" method="get" class="input-group input-group-lg shadow-sm">
                        <input type="text" name="materia" class="form-control" placeholder="Busca una materia, tutor o categor&iacute;a..." aria-label="Buscar">
                        <button type="submit" class="btn btn-light text-primary">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- DESKTOP: Layout Dividido (> lg) -->
    <section class="pb-4 pt-0 d-none d-lg-block">
        <div class="row main-layout g-4">
            <!-- Izquierda: Tutores (25%) -->
            <div th:if="${not #lists.isEmpty(recomendados)}" class="col-lg-3 panel-scrollable tutor-sidebar pt-4">
                <h5 class="fw-bold mb-3">Tutores Recomendados</h5>
                <th:block th:replace="~{fragments/tutor-cards :: tutor-cards(columnClass='g-2', avatarClass='avatar-circle avatar-circle-sm me-2', descLen=80)}"/>
            </div>

            <!-- Derecha: Materias (75%) -->
            <div class="col-lg-9 panel-scrollable pt-4">
                <h2 class="mb-4 fw-bold">Materias por Categor&iacute;a</h2>
                <th:block th:replace="~{fragments/subject-cards :: subject-cards(columnClass='row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3')}"/>
            </div>
        </div>
    </section>

    <!-- MÓVIL: Materias primero (< lg) -->
    <section class="mb-5 d-lg-none stagger-fade stagger-fade-5">
        <h2 class="text-center mb-4 fw-bold">Materias por Categor&iacute;a</h2>
        <th:block th:replace="~{fragments/subject-cards :: subject-cards(columnClass='row row-cols-1 row-cols-md-3 g-3')}"/>
    </section>

    <!-- MÓVIL: Tutores después (< lg) -->
    <section th:if="${not #lists.isEmpty(recomendados)}" class="py-5 d-lg-none" style="background: var(--bg-light-utility);">
        <div class="container">
            <h2 class="text-center fw-bold mb-4 stagger-fade stagger-fade-6">Tutores Recomendados</h2>
            <th:block th:replace="~{fragments/tutor-cards :: tutor-cards(columnClass='row row-cols-1 row-cols-md-2 g-4', avatarClass='avatar-circle me-3', descLen=100)}"/>
        </div>
    </section>
</th:block>

<th:block layout:fragment="scripts-extra"/>
</body>
</html>
