        <div class="container text-center">
            <div class="hero-brand mb-4">
                <div class="hero-brand-name">
                    <span class="hero-tuto">Tuto</span>
                    <span class="hero-match">Match</span>
                </div>
            </div>
            <p class="lead mb-4">Conecta con tutores de la UCE y alcanza tu m&aacute;ximo potencial acad&eacute;mico.</p>

            <div th:if="${not authenticated}" class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a th:href="@{/auth/registro}" class="btn btn-light btn-lg px-4 gap-3">Empezar ahora</a>
                <a th:href="@{/auth/login}" class="btn btn-outline-light btn-lg px-4">Iniciar sesi&oacute;n</a>
            </div>

            <div th:if="${authenticated}" class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <form th:action="@{/buscar}" method="get" class="input-group input-group-lg shadow-sm">
                        <input type="text" name="materia" class="form-control" placeholder="Busca una materia, tutor o categor&iacute;a..." aria-label="Buscar">
                        <button type="submit" class="btn btn-light text-primary">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- DESKTOP: Layout Dividido (> lg) -->
    <section class="pb-4 pt-0 d-none d-lg-block">
        <div class="row main-layout g-4">
            <div class="col-lg-3 panel-scrollable tutor-sidebar pt-4">
                <div th:if="${not #lists.isEmpty(recomendados)}">
                    <h5 class="fw-bold mb-3">Tutores Recomendados</h5>
                    <th:block th:replace="~{fragments/tutor-cards :: tutor-cards(columnClass='g-2', avatarClass='avatar-circle avatar-circle-sm me-2', descLen=80)}"/>
                </div>
            </div>

            <div class="col-lg-9 panel-scrollable pt-4">
                <div class="row g-4 align-items-start">
                    <div class="col-xl-8 col-lg-8">
                        <h2 class="mb-4 fw-bold">Materias por Categor&iacute;a</h2>

                        <div class="mb-5 bloque-categoria">
                            <h4 class="fw-semibold text-secondary pb-2 mb-3 border-bottom">Especialidad</h4>
                            <div id="contenedor-especialidad" class="row row-cols-1 row-cols-md-2 row-cols-xl-2 g-3">
                            </div>
                        </div>

                        <div class="mb-4 bloque-categoria">
                            <h4 class="fw-semibold text-secondary pb-2 mb-3 border-bottom">Tronco Com&uacute;n</h4>
                            <div id="contenedor-tronco" class="row row-cols-1 row-cols-md-2 row-cols-xl-2 g-3">
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-4 col-lg-4 pt-0">
                        <div class="card border-0 shadow-sm rounded-4 p-3 position-sticky bg-light panel-facultades-scroll"
                             style="top: 24px; max-height: 540px; overflow-y: auto;">

                            <h6 class="fw-bold text-uppercase tracking-wider text-muted small mb-3">Facultades</h6>
                            <div id="contenedor-botones-facultades" class="d-flex flex-column gap-2">
                                <button onclick="filtrarPorFacultad('TODAS', this)"
                                        class="btn-facultad btn btn-primary w-100 text-start rounded-3 py-2 px-3 shadow-sm font-medium">

            {"nombre": "Farmacología Odontológica", "categoria": "Especialidad", "facultad": "Odontología", "descripcion": "Uso de analgésicos, anestésicos y antibióticos en la práctica dental.", "icono": "<i class=\"bi bi-heart-pulse fs-3\"></i>"},
            {"nombre": "Metodología de la Investigación", "categoria": "Tronco Común", "facultad": "TODAS", "descripcion": "Pasos del método científico, normas APA/IEEE y redacción académica.", "icono": "<i class=\"bi bi-book fs-3\"></i>"},
            {"nombre": "Comunicación y Lenguaje", "categoria": "Tronco Común", "facultad": "TODAS", "descripcion": "Habilidades de expresión oral, escrita y comprensión lectora.", "icono": "<i class=\"bi bi-chat-left-text fs-3\"></i>"}
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const contenedorEsp = document.getElementById("contenedor-especialidad");
            const contenedorTron = document.getElementById("contenedor-tronco");
            const contenedorEspMovil = document.getElementById("contenedor-especialidad-movil");
            const contenedorTronMovil = document.getElementById("contenedor-tronco-movil");
            const contenedorBarra = document.getElementById("contenedor-botones-facultades");

            materias.forEach(m => {
                const htmlTarjeta = `
                    <div data-facultad="${m.facultad}" class="col tarjeta-materia" style="cursor: pointer;">
                        <div class="card h-100 shadow-sm border-0 rounded-4 p-3 bg-white hvr-grow">
                            <div class="mb-2 ${m.categoria === 'Especialidad' ? 'text-primary' : 'text-success'}">${m.icono}</div>
                            <h5 class="fw-bold text-dark mb-1 nombre-materia-titulo">${m.nombre}</h5>
                            <p class="text-muted small mb-0">${m.descripcion}</p>
                        </div>
                    </div>`;

                if (m.categoria === "Especialidad") {
                    if(contenedorEsp) contenedorEsp.insertAdjacentHTML('beforeend', htmlTarjeta);
                    if(contenedorEspMovil) contenedorEspMovil.insertAdjacentHTML('beforeend', htmlTarjeta);
                } else {
                    if(contenedorTron) contenedorTron.insertAdjacentHTML('beforeend', htmlTarjeta);
                    if(contenedorTronMovil) contenedorTronMovil.insertAdjacentHTML('beforeend', htmlTarjeta);
                }
            });

            document.querySelectorAll('.tarjeta-materia').forEach(tarjeta => {
                tarjeta.addEventListener('click', () => {
                    const tituloElemento = tarjeta.querySelector('.nombre-materia-titulo');
                    if (tituloElemento) {
                        const nombreMateria = tituloElemento.innerText.trim();
                        window.location.href = `/buscar?materia=${encodeURIComponent(nombreMateria)}`;
                    }
                });
            });

            const facultadesSet = new Set();
            materias.forEach(m => {
                if (m.facultad && m.facultad.trim() !== 'TODAS') {
                    facultadesSet.add(m.facultad.trim());
                }
            });

            facultadesSet.forEach(facultad => {
                const btn = document.createElement("button");
                btn.className = "btn-facultad btn btn-light bg-white border w-100 text-start rounded-3 py-2 px-3 text-secondary text-truncate";
                btn.textContent = facultad;
                btn.onclick = function() { filtrarPorFacultad(facultad, this); };
                if(contenedorBarra) contenedorBarra.appendChild(btn);
            });
        });

        function filtrarPorFacultad(facultadSeleccionada, botonActivo) {
            document.querySelectorAll('.btn-facultad').forEach(btn => {
                btn.classList.remove('active-facultad', 'btn-primary');
                btn.classList.add('btn-light', 'text-secondary');
            });

            if (botonActivo) {
                botonActivo.classList.remove('btn-light', 'text-secondary');
                botonActivo.classList.add('active-facultad', 'btn-primary');
            }

            document.querySelectorAll('.tarjeta-materia').forEach(tarjeta => {
                const fac = tarjeta.getAttribute('data-facultad');
                if (facultadSeleccionada === 'TODAS' || fac === facultadSeleccionada || fac === 'TODAS') {
                    tarjeta.style.display = 'block';
                } else {
                    tarjeta.style.display = 'none';
                }
            });
        }
    </script>
</th:block>
</body>
</html>
