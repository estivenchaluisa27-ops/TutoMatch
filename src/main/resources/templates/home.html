<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es"
      layout:decorate="~{layout}"
      th:with="pageTitle='Inicio'">
<head>
<body>
    <th:block layout:fragment="content">
        <!-- Hero Section -->
        <section class="hero-section text-white py-5 mb-5">
            <div class="hero-icons">
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="m8 18-6-6 6-6 1.425 1.425-4.6 4.6L9.4 16.6Zm8 0-1.425-1.425 4.6-4.6L14.6 7.4 16 6l6 6Z"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2m0 2v4h10V4Zm0 6v2h2v-2Zm4 0v2h2v-2Zm4 0v2h2v-2Zm-8 4v2h2v-2Zm4 0v2h2v-2Zm4 0v2h2v-2Zm-8 4v2h2v-2Zm4 0v2h2v-2Zm4 0v2h2v-2Z"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.375 9.825Q21 8.65 21 7t-2.625-2.825T12 3t-6.375 1.175T3 7t2.625 2.825T12 11t6.375-1.175m-3.812 3.463q1.537-.213 2.962-.688t2.45-1.237T21 9.5V12q0 1.1-1.025 1.863t-2.45 1.237t-2.962.688T12 16t-2.562-.213t-2.963-.687t-2.45-1.237T3 12V9.5q0 1.1 1.025 1.863t2.45 1.237t2.963.688T12 13.5t2.563-.213m0 5q1.537-.212 2.962-.687t2.45-1.237T21 14.5V17q0 1.1-1.025 1.863t-2.45 1.237t-2.962.688T12 21t-2.562-.213t-2.963-.687t-2.45-1.237T3 17v-2.5q0 1.1 1.025 1.863t2.45 1.237t2.963.688T12 18.5t2.563-.213"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M12 5.793a28 28 0 0 1 3.342 2.865A28 28 0 0 1 18.207 12m0 0c2.584-3.57 3.554-6.947 2.147-8.354S15.57 3.209 12 5.793a28 28 0 0 0-3.342 2.865A28 28 0 0 0 5.793 12m12.414 0c2.584 3.57 3.554 6.947 2.147 8.354c-1.043 1.043-3.17.78-5.654-.48M18.207 12a28 28 0 0 1-2.865 3.342A28 28 0 0 1 12 18.207m0 0a28 28 0 0 1-3.342-2.865A28 28 0 0 1 5.793 12M12 18.207c-3.57 2.584-6.947 3.554-8.354 2.147S3.209 15.57 5.793 12m0 0C3.21 8.43 2.24 5.053 3.646 3.646c1.043-1.043 3.17-.78 5.654.48"/><circle cx="12" cy="12" r="2"/></svg>
                <svg class="hero-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 .5v6l3.59 4.57a1.5 1.5 0 0 1-1.18 2.43H2.59a1.5 1.5 0 0 1-1.18-2.43L5 6.5v-6M3.5.5h7"/></svg>
                <svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor"><path d="m16 11.78 4.24-7.33 1.73 1-5.23 9.05-6.51-3.75L5.46 19H22v2H2V3h2v14.54L9.5 8Z"/></svg>
            </div>
            <div class="container py-5 text-center">
                <h1 class="display-4 fw-bold mb-3 stagger-fade stagger-fade-1">Domina tus materias con TutoMatch</h1>
                <p class="lead mb-4 stagger-fade stagger-fade-2">Conecta con tutores de la UCE y alcanza tu m&aacute;ximo potencial acad&eacute;mico.</p>
                <div th:if="${not authenticated}" class="d-grid gap-2 d-sm-flex justify-content-sm-center stagger-fade stagger-fade-3">
                    <a th:href="@{/auth/registro}" class="btn btn-light btn-lg px-4 gap-3">Empezar ahora</a>
                    <a th:href="@{/auth/login}" class="btn btn-outline-light btn-lg px-4">Iniciar sesi&oacute;n</a>
                </div>
                <div th:if="${authenticated}" class="d-grid gap-2 d-sm-flex justify-content-sm-center stagger-fade stagger-fade-3">
                    <a th:href="@{/buscar}" class="btn btn-light btn-lg px-4">Buscar tutores</a>
                </div>
            </div>
        </section>

        <!-- Barra de búsqueda rápida -->
        <section class="container mb-5 stagger-fade stagger-fade-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <form th:action="@{/buscar}" method="get" class="input-group input-group-lg shadow-sm">
                        <input type="text" name="materia" class="form-control" placeholder="Busca una materia o categor&iacute;a..." aria-label="Buscar tutores">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Categorías / Materias -->
        <section class="container mb-5 stagger-fade stagger-fade-5">
            <h2 class="text-center mb-4 fw-bold">Materias por Categor&iacute;a</h2>
            <div th:each="entry : ${materiasPorCategoria}" class="mb-4">
                <h4 class="fw-semibold mb-3 section-header" th:text="${entry.key}">Categoría</h4>
                <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-3">
                    <div th:each="m : ${entry.value}" class="col card-fade-in" th:style="'animation-delay: ' + (${m.id} * 0.03) + 's'">
                        <a th:href="@{/buscar(materia=${m.nombre})}" class="text-decoration-none">
                            <div class="card h-100 text-center border-0">
                                <div class="card-body">
                                    <div class="card-icon mx-auto mb-3" th:attr="data-categoria=${m.categoria}">
                                        <th:block th:if="${m.icono != null}">
                                            <span th:utext="${m.icono}"></span>
                                        </th:block>
                                        <i th:if="${m.icono == null}" class="bi bi-book fs-3" th:style="'color: var(--categoria-' + ${#strings.toLowerCase(m.categoria)} + ')'"></i>
                                    </div>
                                    <h6 class="card-title fw-semibold mb-1" th:text="${m.nombre}">Materia</h6>
                                    <small class="text-muted text-truncate d-block" th:text="${m.descripcion}">Descripción</small>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tutores Recomendados -->
        <section th:if="${not #lists.isEmpty(recomendados)}" class="py-5" style="background: #f0ede7;">
            <div class="container">
                <h2 class="text-center fw-bold mb-4 stagger-fade stagger-fade-6">
                    <i class="bi bi-star-fill text-warning me-2"></i>Tutores Recomendados
                </h2>
                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                    <div th:each="t : ${recomendados}" class="col card-fade-in" th:style="'animation-delay: ' + (${t.id} * 0.05) + 's'">
                        <div class="card h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="avatar-circle me-3">
                                        <span th:text="${#strings.substring(t.usuario.nombreCompleto, 0, 1)}">I</span>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0" th:text="${t.usuario.nombreCompleto}">Nombre</h6>
                                        <small class="text-muted" th:text="'Semestre ' + ${t.semestre}">Semestre</small>
                                    </div>
                                </div>
                                <p class="card-text small text-muted mb-2" th:text="${#strings.abbreviate(t.descripcion, 100)}">Descripción</p>
                                 <div class="d-flex justify-content-between align-items-center star-rating">
                                      <span>
                                          <i class="bi bi-star-fill text-warning"></i>
                                          <span class="fw-semibold ms-1" th:text="${t.calificacionPromedio}">5.0</span>
                                      </span>
                                  </div>
                                <a th:href="@{/tutor/{id}(id=${t.id})}" class="btn btn-outline-primary btn-sm w-100 mt-3">
                                    Ver perfil
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </th:block>

    <th:block layout:fragment="scripts-extra">
        <script src="/js/hero-physics.js"></script>
    </th:block>
</body>
</html>
